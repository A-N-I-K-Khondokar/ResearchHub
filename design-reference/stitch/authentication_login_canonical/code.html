<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-stack-xl">
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl border border-outline-variant shadow-md p-stack-xl flex flex-col gap-stack-lg">

<p class="font-body-md text-body-md text-on-surface-variant">Sign in to access research data and networking</p>
</header>
<!-- Form -->
<form class="flex flex-col gap-stack-md">
<!-- Email Input -->
<div class="flex flex-col gap-stack-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email</label>
<input class="w-full h-11 px-3 border border-outline-variant rounded bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all duration-200" id="email" name="email" placeholder="researcher@university.edu" required="" type="email"/>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-stack-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors duration-200" href="#">Forgot Password?</a>
</div>
<input class="w-full h-11 px-3 border border-outline-variant rounded bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Sign In Button -->
<button class="w-full h-11 mt-stack-xs bg-primary-container hover:bg-primary-container/90 text-on-primary font-label-lg text-label-lg rounded flex items-center justify-center transition-colors duration-200 shadow-sm" type="submit">
                Sign In
            </button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-stack-xs">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 text-on-surface-variant font-label-md text-label-md">or</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Login -->
<button class="w-full h-11 border border-outline-variant hover:bg-surface-container-low bg-transparent text-on-surface font-label-lg text-label-lg rounded flex items-center justify-center gap-2 transition-colors duration-200" type="button">
