<body class="h-full bg-background text-on-background flex flex-col font-body-md overflow-x-hidden">
<!-- Top App Bar -->
<header class="sticky top-0 w-full z-50 flex items-center px-4 h-16 bg-surface border-b border-outline-variant">
<button aria-label="Back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors active:scale-95 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex-1 flex justify-center">
<h1 class="font-label-lg text-label-lg font-semibold text-on-surface">Step 2 of 5</h1>
</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col items-center w-full max-w-2xl mx-auto px-margin-mobile pt-stack-lg pb-stack-xl">
<!-- Header Section -->
<div class="text-center mb-stack-xl w-full">
<h2 class="font-display-lg text-display-lg text-on-surface mb-stack-sm">Research Interests</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto">
                Select topics that interest you to personalize your research feed.
            </p>
</div>
<!-- Interest Chips Container -->
<div class="w-full bg-surface rounded-xl border border-outline-variant p-6 shadow-sm mb-stack-xl relative overflow-hidden">
<!-- Decorative subtle background accent -->
<div class="absolute -top-24 -right-24 w-48 h-48 bg-secondary-container opacity-20 rounded-full blur-3xl pointer-events-none"></div>
<div class="flex flex-wrap gap-3 justify-center relative z-10" id="chip-container">
<!-- Chips injected via JS for interaction -->
</div>
</div>
<!-- Action Button -->
<div class="w-full mt-auto mb-stack-lg pb-stack-lg">
<button class="w-full h-[44px] bg-primary text-on-primary font-label-lg text-label-lg rounded-full flex items-center justify-center gap-2 hover:bg-on-primary-fixed-variant transition-all active:scale-95 shadow-md" id="next-btn">
<span>Next Step</span>
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const interests = [
                "Machine Learning", "Artificial Intelligence", "Computer Vision",
                "NLP", "Cyber Security", "Software Engineering",
                "Data Science", "Networks", "Robotics", "Human Computer Interaction"
            ];

            const container = document.getElementById('chip-container');
            const selectedChips = new Set();
            const nextBtn = document.getElementById('next-btn');

            interests.forEach(interest => {
                const btn = document.createElement('button');
                btn.className = 'px-4 py-2 min-h-[44px] rounded-full border border-outline-variant font-label-md text-label-md transition-all duration-200 flex items-center gap-2 bg-surface text-on-surface-variant hover:bg-surface-container-low';
                
                const activeClasses = ['bg-primary-container', 'border-primary-container', 'text-on-primary-container', 'shadow-sm'];
                const inactiveClasses = ['bg-surface', 'border-outline-variant', 'text-on-surface-variant'];

                btn.innerHTML = `
                    <span>${interest}</span>
                    <span class="material-symbols-outlined text-[16px] hidden check-icon" data-icon="check">check</span>
                `;

                btn.addEventListener('click', () => {
                    const isSelected = selectedChips.has(interest);
                    const icon = btn.querySelector('.check-icon');

                    if (isSelected) {
                        selectedChips.delete(interest);
                        btn.classList.remove(...activeClasses);
                        btn.classList.add(...inactiveClasses);
                        icon.classList.add('hidden');
                    } else {
                        selectedChips.add(interest);
                        btn.classList.remove(...inactiveClasses);
                        btn.classList.add(...activeClasses);
                        icon.classList.remove('hidden');
                    }
                    
                    if(selectedChips.size > 0) {
                         nextBtn.classList.remove('opacity-90');
                         nextBtn.querySelector('span:first-child').textContent = `Next Step (${selectedChips.size})`;
                    } else {
                         nextBtn.classList.add('opacity-90');
                         nextBtn.querySelector('span:first-child').textContent = 'Next Step';
                    }
                });

                container.appendChild(btn);
            });
        });
    </script>
