<div class="w-full max-w-[400px] bg-surface rounded-xl border border-outline-variant shadow-[0px_4px_12px_rgba(23,32,51,0.08)] p-stack-xl relative overflow-hidden">

<div class="mb-stack-lg text-center">
<h1 class="font-headline-lg text-headline-lg md:font-headline-lg md:text-headline-lg text-on-surface mb-stack-xs">Reset Password</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your email address and we'll send you a link to reset your password.</p>
</div>
<form action="#" class="space-y-stack-md" method="POST">
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-xs" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full h-[44px] pl-10 pr-3 rounded bg-surface border border-outline-variant text-on-surface font-body-md text-body-md placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary/20 transition-shadow outline-none" id="email" name="email" placeholder="researcher@university.edu" required="" type="email"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-[44px] bg-primary text-on-primary font-label-lg text-label-lg rounded flex items-center justify-center hover:bg-surface-tint transition-colors mt-stack-lg" type="submit">

            </button>
</form>
