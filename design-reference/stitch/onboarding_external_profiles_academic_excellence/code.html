<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CSE Research Hub - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Source+Serif+4:wght@400;600;700&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#dad9e3",

                        "tertiary": "#7a3200",
                        "on-background": "#1a1b22",
                        "surface-container": "#eeedf7",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#b6c4ff",
                        "secondary-container": "#d6e0f8",
                        "surface-tint": "#2f55c6",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#f3f2fd",
                        "inverse-on-surface": "#f1f0fa",

                        "on-error": "#ffffff",
                        "primary-fixed": "#dce1ff",
                        "primary": "#0a3daf",
                        "outline": "#747685",
                        "secondary": "#555f73",

                        "surface-container-lowest": "#ffffff",

                        "on-surface": "#1a1b22",

                        "background": "#faf8ff",
                        "inverse-primary": "#b6c4ff",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",

                    },
                    "spacing": {
                        "stack-md": "16px",
                        "stack-xl": "32px",
                        "stack-xs": "4px",
                        "unit": "8px",
                        "stack-sm": "8px",
                        "margin-mobile": "16px",
                        "stack-lg": "24px",
                        "gutter-mobile": "16px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-lg": ["\"Source Serif 4\""],

                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }]

<style>
        .input-focus-glow:focus {
            outline: none;
            border-color: #3157c8;
            box-shadow: 0 0 0 2px rgba(49, 87, 200, 0.2);
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="h-full bg-background text-on-background font-body-md antialiased flex flex-col">
<!-- Top App Bar -->
<header class="sticky top-0 w-full z-50 flex items-center px-4 h-16 bg-surface border-b border-outline-variant flat no shadows">
<div class="flex items-center gap-4 w-full">
<button class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors active:scale-95 duration-100 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm font-semibold text-primary flex-1 text-center pr-11">CSE Research Hub</h1>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col items-center justify-center p-gutter-mobile overflow-y-auto">
<div class="w-full max-w-md bg-surface border border-outline-variant rounded-xl p-stack-lg shadow-[0px_4px_12px_rgba(23,32,51,0.08)]">
<!-- Progress Indicator -->
<div class="flex items-center justify-between mb-stack-lg">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Step 4 of 5</span>
<div class="flex gap-1">
<div class="w-8 h-1 rounded-full bg-primary-fixed"></div>
<div class="w-8 h-1 rounded-full bg-primary-fixed"></div>
<div class="w-8 h-1 rounded-full bg-primary-fixed"></div>
<div class="w-8 h-1 rounded-full bg-primary"></div>
<div class="w-8 h-1 rounded-full bg-surface-container-highest"></div>
</div>
</div>
<!-- Header -->
<div class="mb-stack-xl text-center">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-stack-sm">Connect External Profiles</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Link your existing research profiles to build your academic identity.</p>
</div>
<!-- Form -->
<form class="space-y-stack-md flex flex-col">
<!-- Google Scholar -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-xs flex items-center gap-2" for="scholar">
<span class="material-symbols-outlined text-[18px]" data-icon="school">school</span>
                        Google Scholar
                    </label>
<div class="relative">
<input class="w-full h-11 px-4 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline input-focus-glow transition-all" id="scholar" placeholder="https://scholar.google.com/citations?user=..." type="url"/>
</div>
</div>
<!-- ResearchGate -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-xs flex items-center gap-2" for="researchgate">
<span class="material-symbols-outlined text-[18px]" data-icon="science">science</span>
                        ResearchGate
                    </label>
<div class="relative">
<input class="w-full h-11 px-4 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline input-focus-glow transition-all" id="researchgate" placeholder="https://www.researchgate.net/profile/..." type="url"/>
</div>
</div>
<!-- IEEE Xplore -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-xs flex items-center gap-2" for="ieee">
<span class="material-symbols-outlined text-[18px]" data-icon="memory">memory</span>
                        IEEE Xplore
                    </label>
<div class="relative">
<input class="w-full h-11 px-4 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline input-focus-glow transition-all" id="ieee" placeholder="https://ieeexplore.ieee.org/author/..." type="url"/>
</div>
</div>
<!-- GitHub -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-xs flex items-center gap-2" for="github">
<span class="material-symbols-outlined text-[18px]" data-icon="code">code</span>
                        GitHub
                    </label>
<div class="relative">
<input class="w-full h-11 px-4 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline input-focus-glow transition-all" id="github" placeholder="https://github.com/..." type="url"/>
</div>
</div>
<!-- Personal Website -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-xs flex items-center gap-2" for="website">
<span class="material-symbols-outlined text-[18px]" data-icon="language">language</span>
                        Personal Website
                    </label>
<div class="relative">
<input class="w-full h-11 px-4 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline input-focus-glow transition-all" id="website" placeholder="https://www.yourdomain.edu" type="url"/>
</div>
</div>
<!-- Actions -->
<div class="pt-stack-lg flex flex-col-reverse sm:flex-row gap-stack-sm sm:gap-stack-md mt-stack-md">
<button class="flex-1 h-11 flex items-center justify-center font-label-lg text-label-lg text-primary bg-primary/10 rounded-full hover:bg-primary/20 transition-colors" type="button">
                        Skip
                    </button>
<button class="flex-1 h-11 flex items-center justify-center font-label-lg text-label-lg text-on-primary bg-primary-container rounded-full hover:opacity-90 transition-opacity shadow-sm" type="button">
                        Next
                    </button>
</div>
</form>
</div>
</main>
</body></html>
