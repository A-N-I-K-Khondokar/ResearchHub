<body class="min-h-screen flex flex-col antialiased">
<!-- 
      Note: Shared Components Navigations (TopAppBar, BottomNavBar) are SUPPRESSED 
      because this is a "Linear/Transactional: Onboarding" screen as per Shell Visibility rules.
    -->
<!-- Main Canvas -->
<main class="flex-grow flex flex-col justify-center items-center px-gutter-mobile py-stack-xl relative overflow-hidden">
<!-- Subtle Abstract Background Graphic for Modern Corporate feel -->
<div class="absolute inset-0 z-0 opacity-[0.03] pointer-events-none flex justify-center items-center">
<div class="w-[800px] h-[800px] rounded-full border-[40px] border-primary-container blur-3xl"></div>
</div>
<div class="w-full max-w-md z-10 relative">
<!-- Progress Indicator -->
<div class="mb-stack-lg flex items-center gap-2">
<div class="h-1 flex-1 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary-container w-3/5 rounded-full"></div>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Step 3 of 5</span>
</div>
<!-- Content Container -->
<div class="bg-surface rounded-xl border border-outline-variant shadow-sm p-stack-lg md:p-stack-xl transition-all duration-300">
<!-- Header -->
<div class="mb-stack-lg text-center md:text-left">
<h1 class="font-display-lg text-display-lg text-on-surface mb-stack-xs tracking-tight">Current Work</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">What are you currently working on?</p>
</div>
<!-- Form Area -->
<div class="mb-stack-xl">
<label class="sr-only" for="currentWork">Current Work Description</label>
<div class="relative group input-glow rounded border border-outline-variant bg-surface transition-all duration-200 flex items-start p-3">
<span aria-hidden="true" class="material-symbols-outlined text-outline mt-1 mr-3 group-focus-within:text-primary-container transition-colors" data-icon="edit_note">edit_note</span>
<textarea class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50 resize-none" id="currentWork" name="currentWork" placeholder="e.g., Optimizing LLMs for Bengali Text" rows="4"></textarea>
</div>
<div class="mt-stack-sm flex items-start gap-2">
<span aria-hidden="true" class="material-symbols-outlined text-on-surface-variant text-[16px] mt-0.5" data-icon="info">info</span>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-tight">
                            This helps others understand your current research momentum.
                        </p>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col-reverse sm:flex-row items-center justify-between gap-stack-md mt-stack-xl pt-stack-md border-t border-surface-variant">
<button class="w-full sm:w-auto px-4 py-2 min-h-[44px] min-w-[44px] font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low active:scale-95 rounded transition-all flex items-center justify-center" type="button">
                        Skip for now
                    </button>
<button class="w-full sm:w-auto px-6 py-2 min-h-[44px] min-w-[44px] bg-primary-container text-on-primary font-label-lg text-label-lg rounded hover:bg-primary active:scale-95 transition-all shadow-sm flex items-center justify-center gap-2 group" type="button">
                        Next
                        <span aria-hidden="true" class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>

<script>
        // Simple micro-interaction for the textarea
        document.addEventListener('DOMContentLoaded', () => {
            const textarea = document.getElementById('currentWork');
            if(textarea) {
                textarea.addEventListener('input', function() {
                    this.style.height = 'auto';
                    this.style.height = (this.scrollHeight) + 'px';
                });
            }
        });
    </script>
