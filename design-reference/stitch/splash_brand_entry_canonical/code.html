<style>
        .dot-pattern {
            background-image: radial-gradient(circle at 2px 2px, #bdc7de 1px, transparent 0);
            background-size: 24px 24px;
        }
        
        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        .animate-fade-in-up {
            animation: fade-in-up 0.8s ease-out forwards;
        }
        
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
    </style>

<body class="bg-background min-h-screen flex items-center justify-center relative overflow-hidden font-body-md text-on-surface">
<!-- Subtle Scholarly Background Pattern -->
<div class="absolute inset-0 dot-pattern opacity-50 z-0"></div>
<!-- Decorative Gradient Blurs for Depth -->
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary-fixed opacity-30 blur-[100px] z-0 pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-secondary-fixed opacity-30 blur-[100px] z-0 pointer-events-none"></div>

<div class="relative z-10 flex flex-col items-center justify-center p-stack-xl max-w-md w-full text-center">
<!-- Logo Container with elegant entrance -->

<div class="flex items-center gap-unit mt-stack-md opacity-0 animate-fade-in-up delay-200 text-on-surface-variant">
<span class="material-symbols-outlined animate-spin text-primary" style="font-size: 20px;">sync</span>
