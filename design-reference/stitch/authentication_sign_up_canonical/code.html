<body class="bg-background text-on-background h-full flex flex-col font-body-lg">

<main class="flex-grow pt-14 pb-16 flex items-center justify-center px-4 md:px-0">
<div class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0px_4px_12px_rgba(23,32,51,0.08)] p-stack-lg">
<div class="text-center mb-stack-xl">
<h2 class="font-display-lg text-display-lg text-on-surface mb-stack-sm">Create Research Identity</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Join the academic network for structured research data.</p>
</div>
<form class="space-y-stack-md flex flex-col">
<!-- Core Info -->
<div class="space-y-stack-md">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-stack-xs" for="fullName">Full Name</label>
<input class="w-full h-11 bg-surface-container-lowest border border-outline-variant rounded-lg px-3 font-body-md text-body-md text-on-surface placeholder:text-outline input-glow outline-none transition-all" id="fullName" name="fullName" placeholder="Dr. Jane Doe" required="" type="text"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-stack-xs" for="email">Institutional Email</label>
<input class="w-full h-11 bg-surface-container-lowest border border-outline-variant rounded-lg px-3 font-body-md text-body-md text-on-surface placeholder:text-outline input-glow outline-none transition-all" id="email" name="email" placeholder="jane.doe@university.edu" required="" type="email"/>
</div>
<div class="grid grid-cols-2 gap-4">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-stack-xs" for="password">Password</label>
<input class="w-full h-11 bg-surface-container-lowest border border-outline-variant rounded-lg px-3 font-body-md text-body-md text-on-surface placeholder:text-outline input-glow outline-none transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-stack-xs" for="confirmPassword">Confirm Password</label>
<input class="w-full h-11 bg-surface-container-lowest border border-outline-variant rounded-lg px-3 font-body-md text-body-md text-on-surface placeholder:text-outline input-glow outline-none transition-all" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password"/>
</div>
</div>
</div>
<hr class="border-outline-variant my-stack-sm"/>
<!-- Optional Academic Info -->
<div class="space-y-stack-md">
<p class="font-label-lg text-label-lg text-on-surface mb-stack-xs">Academic Affiliation (Optional)</p>
<div class="grid grid-cols-2 gap-4">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-stack-xs" for="department">Department</label>
<input class="w-full h-11 bg-surface-container-lowest border border-outline-variant rounded-lg px-3 font-body-md text-body-md text-on-surface placeholder:text-outline input-glow outline-none transition-all" id="department" name="department" placeholder="e.g., CSE" type="text"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-stack-xs" for="batch">Batch/Year</label>
<input class="w-full h-11 bg-surface-container-lowest border border-outline-variant rounded-lg px-3 font-body-md text-body-md text-on-surface placeholder:text-outline input-glow outline-none transition-all" id="batch" name="batch" placeholder="e.g., 2024" type="text"/>
</div>
</div>
</div>
<!-- Actions -->
<div class="pt-stack-md space-y-stack-md">
<button class="w-full h-[44px] bg-primary text-on-primary font-label-lg text-label-lg rounded-lg flex items-center justify-center hover:bg-surface-tint transition-colors shadow-sm" type="submit">

<div class="relative flex items-center justify-center my-stack-sm">

<div class="w-full border-t border-outline-variant"></div>

</div>
