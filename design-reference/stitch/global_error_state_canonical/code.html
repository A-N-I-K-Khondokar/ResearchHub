<body class="bg-background text-on-background antialiased flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-background text-primary dark:text-primary-fixed w-full top-0 sticky border-b border-outline-variant dark:border-outline transition-colors duration-200 flex justify-between items-center px-container-padding py-unit w-full z-50 shadow-none">
<div class="flex items-center gap-stack-gap-sm hover:bg-surface-container-low dark:hover:bg-surface-container-high rounded p-2 transition-colors duration-200 cursor-pointer">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed" data-icon="menu_book">menu_book</span>
<span class="font-headline-md text-headline-md text-primary dark:text-primary-fixed tracking-tight">Scholarly Core</span>
</div>
<!-- Desktop Nav (Hidden on Mobile) -->
<nav class="hidden md:flex gap-stack-gap-lg">
<a class="font-label-md text-label-md text-on-surface-variant dark:text-outline-variant hover:bg-surface-container-low dark:hover:bg-surface-container-high px-3 py-2 rounded transition-colors duration-200" href="#">Home</a>
<a class="font-label-md text-label-md text-on-surface-variant dark:text-outline-variant hover:bg-surface-container-low dark:hover:bg-surface-container-high px-3 py-2 rounded transition-colors duration-200" href="#">Explore</a>
</nav>
</header>
<!-- Main Content Area - Error State -->
<main class="flex-grow flex items-center justify-center p-container-padding">
<!-- Error Card -->
<div class="max-w-md w-full bg-surface border border-outline-variant rounded-lg p-stack-gap-lg flex flex-col items-center text-center shadow-sm relative overflow-hidden">
<!-- Decorative subtle background element -->
<div class="absolute -top-12 -right-12 w-32 h-32 bg-surface-container-high rounded-full opacity-50 blur-2xl pointer-events-none"></div>
<div class="mb-stack-gap-md p-4 bg-surface-container rounded-full">
<span class="material-symbols-outlined text-outline text-[40px] font-light" data-icon="error_outline">error_outline</span>
</div>
<h1 class="font-headline-sm text-headline-sm text-on-surface mb-stack-gap-sm">Something went wrong.</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-gap-lg max-w-sm">
                We're having trouble loading this information. Please check your connection or try again.
            </p>
<button class="bg-primary text-on-primary font-label-md text-label-md py-2 px-6 rounded-lg border border-primary hover:bg-surface-tint hover:text-on-primary transition-colors duration-200 flex items-center gap-2" onclick="window.location.reload()">
<span class="material-symbols-outlined text-[16px]" data-icon="refresh">refresh</span>
                Try Again
            </button>
<div class="mt-stack-gap-lg pt-stack-gap-sm border-t border-outline-variant w-full">
<p class="font-label-md text-label-md text-outline">Error Code: 503_SERVICE_UNAVAILABLE</p>
</div>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden bg-surface dark:bg-background text-primary dark:text-primary-fixed fixed bottom-0 w-full z-50 border-t border-outline-variant dark:border-outline shadow-sm flex justify-around items-center px-container-padding pb-4 pt-2">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant hover:bg-surface-container-lowest dark:hover:bg-surface-container-high scale-95 active:scale-90 transition-transform p-2 rounded" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label-md text-label-md">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant hover:bg-surface-container-lowest dark:hover:bg-surface-container-high scale-95 active:scale-90 transition-transform p-2 rounded" href="#">
<span class="material-symbols-outlined mb-1" data-icon="hub">hub</span>
<span class="font-label-md text-label-md">Explore</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant hover:bg-surface-container-lowest dark:hover:bg-surface-container-high scale-95 active:scale-90 transition-transform p-2 rounded" href="#">
<span class="material-symbols-outlined mb-1" data-icon="add_circle">add_circle</span>
<span class="font-label-md text-label-md">Share</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant hover:bg-surface-container-lowest dark:hover:bg-surface-container-high scale-95 active:scale-90 transition-transform p-2 rounded" href="#">
<span class="material-symbols-outlined mb-1" data-icon="notifications">notifications</span>
<span class="font-label-md text-label-md">Alerts</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant hover:bg-surface-container-lowest dark:hover:bg-surface-container-high scale-95 active:scale-90 transition-transform p-2 rounded" href="#">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-md text-label-md">Profile</span>
</a>
</nav>
