<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Edit Profile - CSE Research Hub</title>

                        "surface-container-high": "#dce9ff",
                        "surface-variant": "#d3e4fe",
                        "surface-container": "#e5eeff",
                        "tertiary-fixed": "#ffdbca",
                        "inverse-surface": "#213145",
                        "outline": "#76777d",
                        "inverse-on-surface": "#eaf1ff",
                        "on-background": "#0b1c30",
                        "primary-fixed": "#dae2fd",

                        "inverse-primary": "#bec6e0",

                        "error-container": "#ffdad6",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-margin": "32px",
                        "container-padding": "16px",
                        "stack-gap-lg": "24px",
                        "stack-gap-md": "16px",
                        "unit": "4px",
                        "stack-gap-sm": "8px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "display-lg": ["\"Source Serif 4\""],
                        "headline-md": ["\"Source Serif 4\""],
                        "headline-sm": ["\"Source Serif 4\""],
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["\"Source Serif 4\""],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {

                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]

                }
            }
        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-background text-primary dark:text-primary-fixed w-full top-0 sticky border-b border-outline-variant dark:border-outline flex justify-between items-center px-container-padding py-unit w-full z-10">
<button class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors duration-200">Cancel</button>
<div class="font-headline-sm text-headline-sm dark:text-inverse-on-surface font-headline-md text-headline-md text-primary dark:text-primary-fixed">Edit Profile</div>
<button class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors duration-200">Save</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow p-container-padding md:p-section-margin max-w-3xl mx-auto w-full space-y-stack-gap-lg">
<!-- 1. Basic Info -->
<section class="bg-surface rounded-lg border border-outline-variant p-stack-gap-md shadow-sm space-y-stack-gap-md">
<h2 class="font-headline-sm text-headline-sm text-primary border-b border-outline-variant pb-unit">Basic Info</h2>
<div class="flex items-center space-x-stack-gap-md">
<div class="relative w-24 h-24 rounded-full overflow-hidden border border-outline-variant group">
<img class="object-cover w-full h-full" data-alt="A highly detailed close up portrait of a young academic researcher in a modern, well lit light-mode laboratory setting. The lighting is soft and pristine white, emphasizing focus and intellect. Deep blacks and pristine whites with a subtle teal accent in the background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAWdlXvVOd6AtVxt2jK8exav3vsCSoMNmozvHnLRAyo8MT7K-5rmaAkaKUe0UBo8iRMaqGdwHZp_0DxBOeWv3JGTG5SfJE2PM-6SEdS_0QIksI0VxMGoNlAEP35HTxxynlIF87t9FGxvBuSZdctSyHsAKqcPnNBd3UMmoz1pnnHE4DI8xHwrYfb_yoyBoFW4KNbW_NV1bSmU1c13BOAyDocA0k1XQIq0DR_LY9ozwi6ECXHQwd7y_1Q"/>
<div class="absolute inset-0 bg-primary/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
<span class="material-symbols-outlined text-surface" data-icon="edit">edit</span>
</div>
</div>
<button class="px-4 py-2 bg-primary text-on-primary font-label-md text-label-md rounded-lg hover:bg-primary-container transition-colors">Change Photo</button>
</div>
<div class="space-y-stack-gap-sm">
<label class="block font-label-md text-label-md text-on-surface">Full Name</label>
<input class="w-full px-3 py-2 border border-outline rounded-DEFAULT bg-surface focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-colors font-body-md text-body-md text-on-surface" type="text" value="Dr. Elena Rostova"/>
</div>
<div class="space-y-stack-gap-sm">
<label class="block font-label-md text-label-md text-on-surface">Bio</label>
<textarea class="w-full px-3 py-2 border border-outline rounded-DEFAULT bg-surface focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-colors font-body-md text-body-md text-on-surface" rows="3">Postdoctoral researcher specializing in Human-Computer Interaction and Generative Models.</textarea>
</div>
</section>
<!-- 2. Academic Details -->
<section class="bg-surface rounded-lg border border-outline-variant p-stack-gap-md shadow-sm space-y-stack-gap-md">
<h2 class="font-headline-sm text-headline-sm text-primary border-b border-outline-variant pb-unit">Academic Details</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-gap-md">
<div class="space-y-stack-gap-sm">
<label class="block font-label-md text-label-md text-on-surface">Department</label>
<select class="w-full px-3 py-2 border border-outline rounded-DEFAULT bg-surface focus:border-secondary focus:ring-1 focus:ring-secondary outline-none font-body-md text-body-md text-on-surface">
<option>Computer Science and Engineering</option>
<option>Electrical Engineering</option>
<option>Information Systems</option>
</select>
</div>
<div class="space-y-stack-gap-sm">
<label class="block font-label-md text-label-md text-on-surface">Batch/Year</label>
<select class="w-full px-3 py-2 border border-outline rounded-DEFAULT bg-surface focus:border-secondary focus:ring-1 focus:ring-secondary outline-none font-body-md text-body-md text-on-surface">
<option>Ph.D. Candidate (Year 3)</option>
<option>Postdoctoral Fellow</option>
<option>Faculty</option>
</select>
</div>
</div>
</section>
<!-- 3. Research Identity -->
<section class="bg-surface rounded-lg border border-outline-variant p-stack-gap-md shadow-sm space-y-stack-gap-md">
<h2 class="font-headline-sm text-headline-sm text-primary border-b border-outline-variant pb-unit">Research Identity</h2>
<div class="space-y-stack-gap-sm">
<label class="block font-label-md text-label-md text-on-surface">Research Interests</label>
<div class="flex flex-wrap gap-2 mb-2">
<span class="inline-flex items-center px-3 py-1 bg-secondary/10 text-secondary border border-secondary rounded-full font-label-md text-label-md">Machine Learning <button class="ml-1 hover:text-on-surface"><span class="material-symbols-outlined text-[14px]" data-icon="close">close</span></button></span>
<span class="inline-flex items-center px-3 py-1 bg-secondary/10 text-secondary border border-secondary rounded-full font-label-md text-label-md">HCI <button class="ml-1 hover:text-on-surface"><span class="material-symbols-outlined text-[14px]" data-icon="close">close</span></button></span>
</div>
<div class="flex space-x-2">
<input class="flex-grow px-3 py-2 border border-outline rounded-DEFAULT bg-surface focus:border-secondary focus:ring-1 focus:ring-secondary outline-none font-body-md text-body-md" placeholder="Add interest..." type="text"/>
<button class="px-4 py-2 border border-secondary text-secondary font-label-md text-label-md rounded-lg hover:bg-secondary/5 transition-colors">Add</button>
</div>
</div>
</section>
</main>
</body></html>
