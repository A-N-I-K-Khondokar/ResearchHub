<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md relative overflow-hidden">
<!-- Header -->
<header class="w-full flex items-center justify-center py-stack-md bg-surface border-b border-outline-variant/50 relative z-20">
<div class="font-label-lg text-on-surface">Step 5 of 5</div>
</header>
<!-- Decorative background elements for a subtle academic feel -->
<div class="absolute inset-0 pointer-events-none opacity-5">
<svg height="100%" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="40" id="grid" patternunits="userSpaceOnUse" width="40">
<path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="1"></path>
</pattern>
</defs>
<rect fill="url(#grid)" height="100%" width="100%"></rect>
</svg>
</div>
<div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary-container rounded-full mix-blend-multiply filter blur-3xl opacity-10 animate-blob"></div>
<div class="absolute top-1/3 right-1/4 w-96 h-96 bg-secondary-container rounded-full mix-blend-multiply filter blur-3xl opacity-10 animate-blob animation-delay-2000"></div>
<main class="w-full max-w-md mx-auto px-margin-mobile flex-1 flex flex-col items-center justify-center text-center relative z-10">
<!-- Visual/Icon Container -->
<div class="w-24 h-24 mb-stack-lg rounded-full bg-surface-container border border-outline-variant flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-primary text-[48px]" style="font-variation-settings: 'FILL' 1;">
                task_alt
            </span>
</div>
<!-- Text Content -->
<h1 class="font-display-lg text-display-lg text-on-surface mb-stack-sm">
            You're ready to explore.
        </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-stack-xl max-w-[280px]">
            Start discovering researchers and projects within the CSE community.
        </p>
<!-- Primary Action Button -->
<button class="w-full h-[44px] bg-primary-container text-on-primary font-label-lg text-label-lg rounded-lg shadow-sm hover:shadow-md transition-all active:scale-95 flex items-center justify-center gap-2">
            Explore CSE Research Hub
            <span class="material-symbols-outlined text-[18px]">
                arrow_forward
            </span>
</button>
<!-- Step Indicator (Optional, to show it's step 5 of 5) -->
<div class="mt-stack-lg flex gap-2">
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-8 h-2 rounded-full bg-primary-container"></div>
</div>
</main>
<style>
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
    </style>
